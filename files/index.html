}
function bindAuthEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=>{ state.authTab=el.getAttribute('data-tab'); state.authError=''; render(); }));
  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.addEventListener('click', ()=>doLogin(document.getElementById('loginEmail').value, document.getElementById('loginPass').value));
  const signupBtn = document.getElementById('signupBtn');
  if(signupBtn) signupBtn.addEventListener('click', ()=>doRegister(
    document.getElementById('suEmail').value, document.getElementById('suName').value, document.getElementById('suUser').value, document.getElementById('suPass').value,
    document.getElementById('suDept').value, document.getElementById('suYear').value
  ));
  document.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ (state.authTab==='login'?loginBtn:signupBtn)?.click(); } }));
}

/* ---------- ONBOARDING ---------- */
function renderOnboarding(){
  const d = state.onboardData;
  const steps = ['Tell us about you','Your interests','Your skills','What are you looking for?'];
  return `<div class="auth-wrap"><div class="auth-box" style="max-width:480px;">
    <div class="auth-hero"><h1>${steps[state.onboardStep-1]}</h1><p>Step ${state.onboardStep} of 4 — this helps other students find you.</p></div>
    <div class="card card-shadow">
      ${state.onboardStep===1?`<div class="field"><label>Short bio</label><textarea id="obBio" rows="3" placeholder="e.g. Interested in AI, electronics, and startups.">${esc(d.bio||'')}</textarea></div>`:''}
      ${state.onboardStep===2?`<div class="field"><label>Pick a few interests</label><div class="chip-select">${INTEREST_OPTIONS.map(i=>`<button type="button" class="chip ${d.interests.includes(i)?'selected':''}" data-ob-chip="interests|${i}">${i}</button>`).join('')}</div></div>`:''}
      ${state.onboardStep===3?`<div class="field"><label>Pick your skills</label><div class="chip-select">${SKILL_OPTIONS.map(i=>`<button type="button" class="chip ${d.skills.includes(i)?'selected':''}" data-ob-chip="skills|${i}">${i}</button>`).join('')}</div></div>`:''}
      ${state.onboardStep===4?`<div class="field"><label>What are you looking for?</label><div class="chip-select">${LOOKING_FOR_OPTIONS.map(i=>`<button type="button" class="chip ${d.lookingFor.includes(i)?'selected':''}" data-ob-chip="lookingFor|${i}">${i}</button>`).join('')}</div></div><div class="field"><label>Goals (optional)</label><textarea id="obGoals" rows="2">${esc(d.goals||'')}</textarea></div>`:''}
      <div style="display:flex;gap:10px;margin-top:6px;">
        ${state.onboardStep>1?`<button class="btn btn-outline btn-block" id="obBack">Back</button>`:''}
        <button class="btn btn-primary btn-block" id="obNext">${state.onboardStep===4?'Finish':'Continue'}</button>
      </div>
      ${state.onboardStep<4?`<div style="text-align:center;margin-top:10px;"><button class="btn btn-ghost btn-sm" id="obSkip">Skip for now</button></div>`:''}
    </div>
  </div></div>`;
}
function bindOnboardingEvents(){
  document.querySelectorAll('[data-ob-chip]').forEach(el=>el.addEventListener('click', ()=>{ const [key,val]=el.getAttribute('data-ob-chip').split('|'); toggleChip(state.onboardData[key], val); el.classList.toggle('selected'); }));
  const back = document.getElementById('obBack'); if(back) back.addEventListener('click', ()=>{ state.onboardStep--; render(); });
  const skip = document.getElementById('obSkip'); if(skip) skip.addEventListener('click', finishOnboarding);
  const next = document.getElementById('obNext');
  if(next) next.addEventListener('click', ()=>{
    if(state.onboardStep===1) state.onboardData.bio = document.getElementById('obBio').value.trim();
    if(state.onboardStep===4){ state.onboardData.goals = document.getElementById('obGoals').value.trim(); finishOnboarding(); return; }
    state.onboardStep++; render();
  });
}

/* =========================================================
   ADMIN DASHBOARD  (only reachable if profiles.is_admin = true,
   which you set yourself via the Supabase SQL editor)
   ========================================================= */
function renderAdminDashboard(){
  const users = Object.values(state.profiles);
  const suspended = users.filter(u=>u.suspended).length;
  const openReports = state.reports.filter(r=>r.status==='open').length;
  const openSafetyFlags = state.safetyFlags.filter(f=>f.status==='open').length;
  const av = state.adminView;
  return `<div class="admin-shell">
    <div class="admin-top">
      <div style="display:flex;align-items:center;gap:10px;">${logoSvg(26)}<span style="font-weight:700;">RECIRCLE Admin</span></div>
      <div style="display:flex;gap:10px;"><button class="btn btn-outline btn-sm" id="backToApp">Back to app</button></div>
    </div>
    <div class="admin-content">
      <div style="display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;">
        ${['overview','safety','users','reports','teams','audit'].map(v=>`<button class="btn btn-sm ${av===v?'btn-mint':'btn-outline'}" data-aview="${v}">${v==='safety'&&openSafetyFlags?`Safety (${openSafetyFlags})`:v[0].toUpperCase()+v.slice(1)}</button>`).join('')}
      </div>
      ${av==='overview'?renderAdminOverview(users,suspended,openReports,openSafetyFlags):''}
      ${av==='safety'?renderAdminSafetyFlags():''}
      ${av==='users'?renderAdminUsers(users):''}
      ${av==='reports'?renderAdminReports():''}
      ${av==='teams'?renderAdminTeams():''}
      ${av==='audit'?renderAdminAudit():''}
    </div>
  </div>`;
}
function renderAdminOverview(users,suspended,openReports,openSafetyFlags){
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:24px;">
    <div class="admin-stat"><div class="num">${users.length}</div><div class="lbl">Total students</div></div>
    <div class="admin-stat"><div class="num">${state.connections.length}</div><div class="lbl">Connections made</div></div>
    <div class="admin-stat"><div class="num">${state.teams.length}</div><div class="lbl">Teams created</div></div>
    <div class="admin-stat"><div class="num">${openReports}</div><div class="lbl">Open reports</div></div>
    <div class="admin-stat"><div class="num">${openSafetyFlags}</div><div class="lbl">Safety reviews</div></div>
    <div class="admin-stat"><div class="num">${suspended}</div><div class="lbl">Suspended accounts</div></div>
    <div class="admin-stat"><div class="num">${state.requests.filter(r=>r.status==='pending').length}</div><div class="lbl">Pending requests</div></div>
  </div>
  <div class="admin-card"><h3>Safety review protocol</h3><p style="color:#8695A8;font-size:13.5px;">The Safety tab contains only AI-flagged excerpts from Founder Guide chats. It is not an emergency dispatch system. Review promptly using your campus escalation protocol and record the outcome; do not diagnose or rely on this queue as the only response.</p></div>`;
}
function renderAdminSafetyFlags(){
  const flags=state.safetyFlags||[];
  return `<div class="admin-card"><h3>Safety review queue</h3><p style="color:#8695A8;font-size:13px;">Private review cases are created only for serious safety-risk signals in Founder Guide. This queue needs a trained, designated responder.</p>
    ${flags.length===0?'<p style="color:#8695A8;">No safety reviews are waiting.</p>':''}
    ${flags.map(f=>`<div class="card" style="background:#0C1420;border-color:#1E2A3A;margin-bottom:10px;"><div style="display:flex;justify-content:space-between;gap:12px;"><div><div style="font-weight:700;">${esc(f.risk_level)} priority — @${esc(pName(f.user_id))}</div><div style="color:#8695A8;font-size:12px;margin-top:2px;">${esc(f.category)} • ${timeAgo(f.created_at)}</div><div style="margin-top:9px;line-height:1.45;">${esc(f.excerpt)}</div></div><span class="badge-${f.status==='open'?'open':f.status==='dismissed'?'dismissed':'resolved'}">${esc(f.status)}</span></div>
      ${f.status==='open'?`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;"><button class="btn btn-mint btn-sm" data-safety-flag="${f.id}|contacted">Mark contacted</button><button class="btn btn-outline btn-sm" data-safety-flag="${f.id}|resolved">Resolve</button><button class="btn btn-outline btn-sm" data-safety-flag="${f.id}|dismissed">Dismiss</button></div>`:''}
    </div>`).join('')}
  </div>`;
}
function renderAdminUsers(users){
  return `<div class="admin-card"><h3>All students</h3><div class="table-scroll"><table><thead><tr><th>Username</th><th>Department</th><th>Year</th><th>Joined</th><th>Status</th><th></th></tr></thead><tbody>
    ${users.length===0?`<tr><td colspan="6" style="color:#8695A8;">No students registered yet.</td></tr>`:''}
    ${users.map(u=>`<tr><td>@${esc(u.username)}</td><td>${esc(u.department)}</td><td>${esc(u.year)}</td><td>${new Date(u.created_at).toLocaleDateString()}</td>
      <td>${u.suspended?'<span class="badge-open">Suspended</span>':'<span class="badge-resolved">Active</span>'}</td>
      <td><button class="btn btn-sm ${u.suspended?'btn-mint':'btn-coral'}" data-toggle-suspend="${u.id}">${u.suspended?'Reinstate':'Suspend'}</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function renderAdminReports(){
  return `<div class="admin-card"><h3>Reports</h3>
    ${state.reports.length===0?'<p style="color:#8695A8;">No reports filed.</p>':''}
    ${state.reports.map(r=>`<div class="card" style="background:#0C1420;border-color:#1E2A3A;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><div style="font-weight:700;">Report #${r.id.slice(-4)} — ${esc(r.reason)}</div>
        <div style="color:#8695A8;font-size:12.5px;margin-top:2px;">Reported by @${esc(pName(r.reporter))} • against @${esc(pName(r.reported))} • ${timeAgo(r.created_at)}</div>
        ${r.details?`<div style="margin-top:8px;font-size:13.5px;">${esc(r.details)}</div>`:''}</div>
        <span class="badge-${r.status==='open'?'open':r.status==='resolved'?'resolved':'dismissed'}">${r.status}</span>
      </div>
      ${r.status==='open'?`<div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-mint btn-sm" data-report-action="${r.id}|warn">Warn user</button>
        <button class="btn btn-coral btn-sm" data-report-action="${r.id}|suspend">Suspend user</button>
        <button class="btn btn-outline btn-sm" data-report-action="${r.id}|dismiss">Dismiss</button>
      </div>`:''}
    </div>`).join('')}
  </div>`;
}
function renderAdminTeams(){
  return `<div class="admin-card"><h3>Teams</h3><div class="table-scroll"><table><thead><tr><th>Title</th><th>Type</th><th>Creator</th><th>Members</th><th>Status</th></tr></thead><tbody>
    ${state.teams.length===0?`<tr><td colspan="5" style="color:#8695A8;">No teams yet.</td></tr>`:''}
    ${state.teams.map(t=>`<tr><td>${esc(t.title)}</td><td>${t.type}</td><td>@${esc(pName(t.creator))}</td><td>${t.members.length}/${t.size}</td><td>${t.status}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function renderAdminAudit(){
  const log = state.auditLog||[];
  return `<div class="admin-card"><h3>Audit log</h3><div class="table-scroll"><table><thead><tr><th>Time</th><th>Action</th><th>Target</th><th>Reason</th></tr></thead><tbody>
    ${log.length===0?`<tr><td colspan="4" style="color:#8695A8;">No admin actions logged yet.</td></tr>`:''}
    ${log.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${esc(l.action)}</td><td>@${esc(pName(l.target))}</td><td>${esc(l.reason||'')}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
async function logAdminAction(action, targetId, reason){
  await sb.from('audit_log').insert({ admin: state.authUser.id, action, target: targetId, reason: reason||'' });
}
function bindAdminDashboardEvents(){
  document.getElementById('backToApp').addEventListener('click', ()=>{ state.view='home'; render(); });
  document.querySelectorAll('[data-aview]').forEach(el=>el.addEventListener('click', async ()=>{
    state.adminView = el.getAttribute('data-aview');
    if(state.adminView==='audit'){ const {data} = await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200); state.auditLog=data||[]; }
    render();
  }));
  document.querySelectorAll('[data-toggle-suspend]').forEach(el=>el.addEventListener('click', async ()=>{
    const uid = el.getAttribute('data-toggle-suspend');
    const u = state.profiles[uid];
    const newVal = !u.suspended;
    await sb.from('profiles').update({ suspended: newVal }).eq('id', uid);
    await logAdminAction(newVal?'Suspended account':'Reinstated account', uid, 'Manual admin action');
    await loadAllData();
    toast(newVal?'Account suspended.':'Account reinstated.'); render();
  }));
  document.querySelectorAll('[data-report-action]').forEach(el=>el.addEventListener('click', async ()=>{
    const [id, action] = el.getAttribute('data-report-action').split('|');
    const r = state.reports.find(x=>x.id===id); if(!r) return;
    if(action==='warn'){ await sb.from('reports').update({status:'resolved'}).eq('id',id); await sb.from('notifications').insert({user_id:r.reported, type:'warning', body:'You received a warning from campus admin regarding recent activity.'}); await logAdminAction('Issued warning', r.reported, r.reason); }
    if(action==='suspend'){ await sb.from('reports').update({status:'resolved'}).eq('id',id); await sb.from('profiles').update({suspended:true}).eq('id', r.reported); await logAdminAction('Suspended account', r.reported, r.reason); }
    if(action==='dismiss'){ await sb.from('reports').update({status:'dismissed'}).eq('id',id); await logAdminAction('Dismissed report', r.reported, r.reason); }
    await loadAllData();
    toast('Report updated.'); render();
  }));
  document.querySelectorAll('[data-safety-flag]').forEach(el=>el.addEventListener('click', async ()=>{
    const [id,status]=el.getAttribute('data-safety-flag').split('|');
    const flag=state.safetyFlags.find(f=>f.id===id); if(!flag) return;
    const { error }=await sb.from('ai_safety_flags').update({status,reviewed_at:new Date().toISOString(),reviewed_by:state.authUser.id}).eq('id',id);
    if(error){ toast('Could not update this safety review.'); return; }
    await logAdminAction(`Safety review marked ${status}`,flag.user_id,flag.category);
    await loadAllData(); toast('Safety review updated.'); render();
  }));
}

/* =========================================================
   INIT
   ========================================================= */
async function init(){
  if(!CONFIGURED){ render(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    state.authUser = session.user;
    await loadAllData();
    seedCelebratedIfNeeded();
    if(!state.me){ state.view='onboarding'; state.onboardStep=1; state.onboardData={interests:[],skills:[],lookingFor:[]}; }
    else state.view = (state.me.interests?.length || state.me.bio) ? 'home' : 'onboarding';
    if(state.view==='onboarding' && !state.onboardData.interests) state.onboardData={interests:[],skills:[],lookingFor:[]};
  } else {
    state.view='login';
  }
  render();

  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_OUT'){ state.authUser=null; state.me=null; state.view='login'; render(); }
  });

  setInterval(async ()=>{
    if(!state.authUser) return;
    await refreshLite();
    if(['discover','home','circle','notifications','teams'].includes(state.view) && !state.teamFormOpen) render();
    if(state.view==='chatThread' && state.activeChatWith) renderChatThread(state.activeChatWith);
  }, 8000);

  // Re-measure whenever the real visible area changes — rotating the phone,
  // the browser's own address bar sliding away on scroll, or the keyboard
  // opening. This is what actually fixes "short screen" devices, rather than
  // any one fixed pixel guess.
  window.addEventListener('resize', ()=>requestAnimationFrame(adjustMobileLayout));
  window.addEventListener('orientationchange', ()=>setTimeout(adjustMobileLayout, 200));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', ()=>requestAnimationFrame(adjustMobileLayout));
  }
}
init();

// Register the service worker so Chrome/Android offer a real "Install app"
// option (this is required for installability — see sw.js for details).
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine to ignore — app still works in-browser */ });
  });
}
</script>
