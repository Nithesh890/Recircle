<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECIRCLE — Find your people</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#101827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RECIRCLE">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F6F8F7;
    --surface:#FFFFFF;
    --ink:#101827;
    --ink-soft:#5B6472;
    --ink-faint:#98A1AC;
    --navy:#101827;
    --primary:#0E8C7F;       /* teal */
    --primary-dark:#0A6B61;
    --primary-tint:#E4F5F2;
    --coral:#FF6B4A;         /* citrus coral — CTAs */
    --coral-tint:#FFE9E2;
    --sun:#FFB238;
    --sun-tint:#FFF2DE;
    --violet:#7C6CF0;
    --violet-tint:#EDEBFE;
    --border:#E4E8EA;
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:26px;
    --shadow: 0 1px 2px rgba(16,24,39,.04), 0 10px 28px -14px rgba(16,24,39,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;}
  img,svg{max-width:100%;}
  h1,h2,h3,.display{font-family:'Sora',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  input,select,textarea{font-family:inherit;}

  #app{min-height:100vh;}

  /* ---------- top nav shell ---------- */
  .shell{display:flex;flex-direction:column;min-height:100vh;}
  .topnav{
    display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--surface);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;
  }
  .topnav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:9px;margin-right:8px;flex-shrink:0;}
  .brand-name{font-family:'Sora';font-weight:800;font-size:18px;letter-spacing:-0.01em;}
  .topnav-links{display:flex;gap:4px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
    color:var(--ink-soft);font-weight:600;font-size:13.5px;border:none;background:none;position:relative;
  }
  .nav-item:hover{background:var(--primary-tint);color:var(--primary-dark);}
  .nav-item.active{background:var(--navy);color:#fff;}
  .nav-badge{background:var(--coral);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 6px;min-width:15px;text-align:center;}
  .nav-item.active .nav-badge{background:rgba(255,255,255,.28);}

  .main{flex:1;width:100%;}
  .content{padding:30px 26px 60px;max-width:1000px;width:100%;margin:0 auto;}

  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-family:'Sora';}
  .icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;}
  .icon-btn:hover{background:var(--primary-tint);}

  .btn{border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;border:none;display:inline-flex;align-items:center;gap:6px;transition:transform .12s ease;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-coral{background:var(--coral);color:#fff;}
  .btn-coral:hover{filter:brightness(.95);}
  .btn-mint{background:var(--primary);color:#fff;}
  .btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--border);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-sm{padding:7px 14px;font-size:13px;}
  .btn-block{width:100%;justify-content:center;}
  .btn[disabled]{opacity:.5;cursor:default;pointer-events:none;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;}
  .card-shadow{box-shadow:var(--shadow);}
  .card-accent{border-left:4px solid var(--primary);}

  .pill{display:inline-flex;align-items:center;gap:4px;background:var(--primary-tint);color:var(--primary-dark);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;}
  .pill-coral{background:var(--coral-tint);color:#C2451F;}
  .pill-violet{background:var(--violet-tint);color:#5240C7;}
  .pill-sun{background:var(--sun-tint);color:#9A6300;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-s);padding:11px 13px;font-size:14.5px;color:var(--ink);background:var(--bg);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);background:#fff;}
  .field-err{font-size:12.5px;color:var(--coral);margin-top:5px;font-weight:600;}
  .chip-select{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .chip.selected{background:var(--navy);border-color:var(--navy);color:#fff;}

  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(circle at 15% 10%, rgba(14,140,127,.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(255,107,74,.10), transparent 40%), var(--bg);}
  .auth-box{width:100%;max-width:420px;}
  .auth-hero{text-align:center;margin-bottom:26px;}
  .auth-hero .logo-row{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:14px;}
  .auth-hero h1{font-size:25px;margin:0;letter-spacing:-0.02em;}
  .auth-hero p{color:var(--ink-soft);font-size:14.5px;margin:6px 0 0;}
  .tab-row{display:flex;background:var(--primary-tint);border-radius:999px;padding:4px;margin-bottom:20px;}
  .tab-btn{flex:1;border:none;background:none;padding:9px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--primary-dark);}
  .tab-btn.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .student-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;display:flex;flex-direction:column;gap:10px;}
  .student-card:hover{border-color:var(--primary);}
  .student-top{display:flex;gap:12px;align-items:flex-start;}
  .student-name{font-weight:700;font-size:15.5px;}
  .student-meta{font-size:12.5px;color:var(--ink-faint);}
  .student-bio{font-size:13px;color:var(--ink-soft);line-height:1.45;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;}
  .shared-note{font-size:12px;color:var(--primary-dark);font-weight:700;}

  .empty-state{text-align:center;padding:56px 20px;color:var(--ink-faint);}
  .empty-state .e-icon{font-size:34px;margin-bottom:10px;}
  .empty-state h3{color:var(--ink);margin:0 0 6px;}

  .fn-overlay{position:fixed;inset:0;background:rgba(16,24,39,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .fn-overlay.show{opacity:1;pointer-events:auto;}
  .fn-card{background:#fff;border-radius:28px;padding:44px 36px;text-align:center;max-width:360px;width:90%;transform:scale(.85) translateY(10px);opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);}
  .fn-overlay.show .fn-card{transform:scale(1) translateY(0);opacity:1;}
  .fn-emoji{font-size:52px;margin-bottom:6px;}
  .fn-title{font-family:'Sora';font-size:24px;font-weight:800;color:var(--ink);margin:6px 0;}
  .fn-sub{color:var(--ink-soft);font-size:14.5px;margin-bottom:22px;}
  .fn-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
  .fn-step{background:var(--primary-tint);color:var(--primary-dark);border-radius:12px;padding:10px;font-weight:700;font-size:13.5px;opacity:0;transform:translateX(-8px);transition:all .3s ease;}
  .fn-overlay.show .fn-step{opacity:1;transform:translateX(0);}
  .fn-overlay.show .fn-step:nth-child(1){transition-delay:.25s;}
  .fn-overlay.show .fn-step:nth-child(2){transition-delay:.4s;}

  .toast-wrap{position:fixed;top:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:toastIn .25s ease;max-width:300px;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  .modal-bg{position:fixed;inset:0;background:rgba(16,24,39,.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:#fff;border-radius:var(--radius-l);padding:26px;max-width:440px;width:100%;max-height:86vh;overflow:auto;}

  .chat-shell{display:flex;height:calc(100vh - 190px);height:calc(100dvh - 190px);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;background:#fff;}
  .chat-list{width:280px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
  .chat-list-item{display:flex;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
  .chat-list-item:hover{background:var(--primary-tint);}
  .chat-list-item.active{background:var(--primary-tint);}
  .chat-thread{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .chat-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .msg-row{
  display:flex;
  width:100%;
  min-width:0;
}
  .msg-row.mine{justify-content:flex-end;}
  .msg-bubble{
  max-width:70%;
  width:max-content;
  padding:9px 13px;
  border-radius:16px;
  font-size:14px;
  line-height:1.4;
  overflow-wrap:anywhere;
  word-break:normal;
}
  .msg-row.mine .msg-bubble{background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
  .msg-row:not(.mine) .msg-bubble{background:var(--bg);color:var(--ink);border-bottom-left-radius:4px;}
  .chat-photo{max-width:100%;max-height:260px;border-radius:16px;display:block;cursor:pointer;object-fit:cover;}
  .chat-input-row{display:flex;gap:6px;padding:12px 14px;border-top:1px solid var(--border);align-items:center;flex-wrap:nowrap;max-width:100%;box-sizing:border-box;}
  .chat-input-row input{flex:1 1 auto;min-width:0;border:1.5px solid var(--border);border-radius:999px;padding:9px 15px;font-size:14px;}
  .chat-round-btn{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:none;
    display:flex;align-items:center;justify-content:center;transition:transform .12s ease;padding:0;
  }
  .chat-round-btn:active{transform:scale(.92);}
  .chat-round-btn svg{display:block;flex-shrink:0;}
  .chat-round-btn.camera{background:var(--bg);border:1.5px solid var(--border);color:var(--ink-soft);}
  .chat-round-btn.camera:hover{background:var(--primary-tint);color:var(--primary-dark);}
  .chat-round-btn.send{background:var(--navy);color:#fff;}
  .chat-round-btn.send:hover{background:#000;}
  .starter-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;}
  .starter-chip{background:var(--sun-tint);color:#9A6300;border:none;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;}

  /* ---------- Founder Guide ---------- */
  .guide-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:18px;align-items:start;}
  .guide-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
  .guide-head{padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:11px;}
  .guide-orb{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--violet),var(--primary));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .guide-chat{min-height:390px;max-height:520px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px;background:linear-gradient(180deg,#fff 0%,#F9FCFB 100%);}
  .guide-msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.48;white-space:normal;}
  .guide-msg.assistant{align-self:flex-start;background:var(--primary-tint);color:#184C46;border-bottom-left-radius:4px;}
  .guide-msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
  .guide-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:-4px;}
  .guide-action{border:1px solid #BFE4DE;background:#fff;color:var(--primary-dark);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;}
  .guide-action:hover{background:var(--primary-tint);}
  .guide-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
  .guide-input input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:999px;padding:10px 13px;font-size:14px;}
  .crisis-banner{display:flex;gap:12px;align-items:flex-start;background:#FFF4F0;border:1px solid #FFD1C5;border-radius:var(--radius-m);padding:15px 16px;margin-bottom:18px;}
  .crisis-banner strong{display:block;color:#9A351C;margin-bottom:3px;font-size:13.5px;}
  .crisis-banner p{margin:0;color:#744130;font-size:12.5px;line-height:1.45;}
  .crisis-link{margin-left:auto;flex-shrink:0;color:#A33A20;font-size:12.5px;font-weight:800;background:none;border:none;text-decoration:underline;padding:2px;}
  .guide-side .card{margin-bottom:14px;}
  .match-mini{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
  .match-mini:last-child{border-bottom:none;}
  .match-mini-main{min-width:0;flex:1;}
  .match-reason{font-size:11.5px;color:var(--primary-dark);font-weight:700;margin-top:2px;}
  .crisis-panel{margin-top:14px;background:#fff;border:1.5px solid var(--coral);border-radius:var(--radius-m);padding:18px;}
  .crisis-panel h3{margin:0 0 7px;color:#8E311A;}
  .crisis-panel p{font-size:13.5px;line-height:1.5;color:var(--ink-soft);}
  .crisis-steps{padding-left:19px;margin:10px 0 16px;color:var(--ink-soft);font-size:13px;line-height:1.55;}
  @media(max-width:760px){.guide-layout{grid-template-columns:1fr;}.guide-chat{min-height:330px;max-height:420px;}.crisis-banner{flex-wrap:wrap;}.crisis-link{margin-left:0;}}

  .hero-band{background:var(--navy);color:#fff;border-radius:28px;padding:34px 30px;margin-bottom:24px;position:relative;overflow:hidden;}
  .hero-band h1{font-size:26px;margin:0 0 6px;}
  .hero-band p{color:#B8C0CC;margin:0;font-size:14.5px;}
  .stat-card{border-radius:var(--radius-m);padding:20px;color:#fff;position:relative;overflow:hidden;}
  .stat-card h3{margin:2px 0 4px;font-size:16px;}
  .stat-card p{margin:0;font-size:13px;opacity:.92;}
  .stat-card .sc-icon{font-size:24px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;}
  .section-head h2{font-size:17px;margin:0;}
  .section-head:first-child{margin-top:0;}

  .bottom-nav{display:none;}
  .hide-on-mobile{display:inline-flex;}
  .mobile-only{display:none;}
  @media (max-width:860px){
    .topnav-links{display:none;}
    .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50;}
    .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink-faint);font-size:10.5px;font-weight:700;padding:8px 0;min-height:44px;}
    .bn-item.active{color:var(--primary);}
    .bn-item .emoji{font-size:19px;}
    .content{padding-bottom:calc(84px + env(safe-area-inset-bottom));}
    .chat-shell{height:calc(100dvh - 230px);}
    .chat-list{width:100%;}
    .hide-on-mobile{display:none;}
    .mobile-only{display:inline-flex;}
    /* single-pane chat on phones: show list OR thread, never both squeezed together */
    .chat-list-mode .chat-thread{display:none;}
    .chat-thread-mode .chat-list{display:none;}
  }
  @media (max-width:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .field input,.field select,.field textarea{font-size:16px;}
  .chat-input-row input{font-size:16px;}
  .btn{min-height:40px;}
  .btn-sm{min-height:34px;}
  
  .msg-bubble{
    max-width:82%;
    font-size:15px;
  }
}
  @media (max-width:420px){
    .grid{grid-template-columns:1fr;}
    .auth-hero h1{font-size:22px;}
  }
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:520px;}

  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
  .switch-row:last-child{border-bottom:none;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--ink-faint);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}

  .admin-shell{background:#0C1420;color:#fff;min-height:100vh;}
  .admin-top{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid #1E2A3A;}
  .admin-content{max-width:1080px;margin:0 auto;padding:28px;}
  .admin-stat{background:#121D2C;border-radius:16px;padding:18px;border:1px solid #1E2A3A;}
  .admin-stat .num{font-family:'Sora';font-size:26px;font-weight:800;}
  .admin-stat .lbl{color:#8695A8;font-size:12.5px;margin-top:2px;}
  .admin-card{background:#121D2C;border-radius:16px;padding:20px;border:1px solid #1E2A3A;margin-bottom:18px;}
  .admin-card h3{margin-top:0;}
  .badge-open{background:#3D2E1A;color:#FFB238;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .badge-resolved{background:#123A32;color:#0E8C7F;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .badge-dismissed{background:#1E2A3A;color:#8695A8;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .admin-shell .field label{color:#8695A8;}
  .admin-shell .field input,.admin-shell .field select,.admin-shell .field textarea{background:#0C1420;border-color:#1E2A3A;color:#fff;}
  .admin-shell .btn-outline{border-color:#1E2A3A;color:#fff;}
  .small-link{color:var(--ink-faint);font-size:12px;}

  .config-banner{background:#FFF2DE;color:#9A6300;padding:14px 20px;font-size:13.5px;font-weight:600;text-align:center;}
  .config-banner code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:5px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  @media (max-width:600px){
    .content{padding:16px;}
    .topnav{padding:12px 16px;}
    .hero-band{padding:24px 20px;}
    .admin-top{padding:14px 16px;}
    .admin-content{padding:18px 16px;}
    .modal-box{padding:20px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toastWrap" class="toast-wrap"></div>
<div id="fnOverlayRoot"></div>

<script>
/* =========================================================
   RECIRCLE — standalone build for Netlify + Supabase.

   SETUP (see SETUP_GUIDE.md for full walkthrough):
   1. Create a free project at supabase.com
   2. Run schema.sql in the Supabase SQL editor
   3. Paste your Project URL + anon public key below
   4. Deploy this file (as index.html) to Netlify

async function doRegister(email, fullName, username, password, dept, year){
  fullName = fullName.trim().replace(/\s+/g,' ');
  username = username.trim().toLowerCase();
  email = email.trim();
  if(!/^[a-z0-9_]{3,20}$/.test(username)){ state.authError='Username must be 3-20 characters: letters, numbers, underscore only.'; render(); return; }
  if(!email.includes('@')){ state.authError='Enter a valid email address.'; render(); return; }
  if(fullName.length<2 || fullName.length>60){ state.authError='Enter your real name (2-60 characters).'; render(); return; }
  if(password.length<6){ state.authError='Password must be at least 6 characters.'; render(); return; }
  if(!dept||!year){ state.authError='Please select your department and year.'; render(); return; }

  const { data: existing } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
  if(existing){ state.authError='That username is already taken.'; render(); return; }

  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ state.authError = error.message; render(); return; }
  if(!data.user){ state.authError='Check your email to confirm your account, then log in.'; render(); return; }

  const { error: profErr } = await sb.from('profiles').insert({
    id: data.user.id, full_name: fullName, username, department: dept, year, bio:'', interests:[], skills:[], goals:'', looking_for:[]
  });
  if(profErr){ state.authError = profErr.message; render(); return; }

  state.authUser = data.user;
  await loadAllData();
  seedCelebratedIfNeeded();
  state.onboardStep = 1; state.onboardData = { interests:[], skills:[], lookingFor:[] };
  state.view='onboarding'; state.authError=''; render();
}
async function doLogin(email, password){
  const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
  if(error){ state.authError = error.message; render(); return; }
  state.authUser = data.user;

/* ---- "Friends Now" tracking so BOTH people see the celebration, not just
   whoever clicked Accept. We can't add a database column for this without
   touching schema.sql (which we're avoiding on a live app with real users),
   so we track "already celebrated" connection ids in this browser's
   localStorage per account, and poll for newly-appeared connections. ---- */
function celebratedKey(){ return 'recircle_celebrated_'+(state.authUser?state.authUser.id:'anon'); }
function loadCelebrated(){
  try{ return new Set(JSON.parse(localStorage.getItem(celebratedKey())||'[]')); }
  catch(e){ return new Set(); }
}
function saveCelebrated(){
  try{ localStorage.setItem(celebratedKey(), JSON.stringify([...state.celebratedIds])); }catch(e){}
}
function markCelebrated(connId){
  if(!state.celebratedIds) state.celebratedIds = loadCelebrated();
  state.celebratedIds.add(connId); saveCelebrated();
}
function seedCelebratedIfNeeded(){
  if(!state.authUser) return;
  const already = localStorage.getItem(celebratedKey());
  if(already===null){
    const myId = state.authUser.id;
    const mine = state.connections.filter(c=>c.user_a===myId||c.user_b===myId).map(c=>c.id);
    state.celebratedIds = new Set(mine);
    saveCelebrated();
  } else {
    state.celebratedIds = loadCelebrated();
  }
}
function detectNewFriendsNow(oldConns){
  if(state.friendsNowTarget) return; // one celebration at a time
  if(!state.celebratedIds) state.celebratedIds = loadCelebrated();
  const myId = state.authUser.id;
  const oldIds = new Set(oldConns.map(c=>c.id));
  for(const c of state.connections){
    if((c.user_a===myId||c.user_b===myId) && !oldIds.has(c.id) && !state.celebratedIds.has(c.id)){
      markCelebrated(c.id);
      const otherId = c.user_a===myId? c.user_b : c.user_a;
      showFriendsNow(otherId);
      break;
    }
  }
}

/* Resize + compress a photo in the browser before it ever reaches Supabase,
   so a full-size camera photo (often 4-8 MB) becomes a small, fast upload
   (roughly 100-300 KB) — this is what keeps you comfortably inside the
   free storage/bandwidth limits. Returns a JPEG Blob. */
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file.'));
    reader.onload = () => {
      img.onerror = () => reject(new Error('That file doesn\'t look like a valid image.'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Compression failed.')), 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadChatPhoto(file){
  if(!file.type || !file.type.startsWith('image/')){
    toast('Only photos can be shared here.');
    return null;
  }
  const blob = await compressImage(file);
  const myId = state.authUser.id;
  const path = `${myId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await sb.storage.from('chat-images').upload(path, blob, { contentType:'image/jpeg', upsert:false });
  if(error){ toast('Photo upload failed: '+error.message); return null; }
  const { data } = sb.storage.from('chat-images').getPublicUrl(path);
  return data ? data.publicUrl : null;
}

/* Measures REAL rendered heights on this exact device/browser instead of
   guessing fixed pixel numbers — fixes short-screen phones and browsers
   whose own address bar / toolbar eat unpredictable amounts of space. */
function adjustMobileLayout(){
  const bottomnav = document.querySelector('.bottom-nav');
  const contentEl = document.querySelector('.content');
  const topnav = document.querySelector('.topnav');
  const isMobileNav = bottomnav && getComputedStyle(bottomnav).display !== 'none';

  // 1) Make sure page content always clears the fixed bottom tab bar,
  //    using its REAL height rather than an assumed one.
  if(contentEl){
    if(isMobileNav){
      const bnH = bottomnav.getBoundingClientRect().height;
      contentEl.style.paddingBottom = (bnH + 28) + 'px';
    } else {
      contentEl.style.paddingBottom = '';
    }
  }

  // 2) Size the chat panel to whatever space is ACTUALLY left on screen,
  //    accounting for the browser's own toolbars via visualViewport when
  //    available (most accurate signal for "how tall is my screen really").
  const shell = document.querySelector('.chat-shell');
  if(shell){
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const topH = topnav ? topnav.getBoundingClientRect().height : 0;
    const bnH = isMobileNav ? bottomnav.getBoundingClientRect().height : 0;
    const contentPadTop = contentEl ? parseFloat(getComputedStyle(contentEl).paddingTop)||0 : 0;
    const available = vh - topH - bnH - contentPadTop - 20;
    shell.style.height = Math.max(280, available) + 'px';
  }
}

/* ---------- Founder Guide: support, team formation, and safe escalation ---------- */
function guideText(text){ return esc(text||'').replace(/\n/g,'<br>'); }
function guideMessage(role, text, actions){ return { role, text, actions:actions||[] }; }
const COFOUNDER_QUESTIONS = [
  {key:'problem', question:'1 of 6 — What real problem do you care enough to work on for the next year? Who has it?'},
  {key:'commitment', question:'2 of 6 — How much time can you consistently commit each week for the next three months?'},
  {key:'strengths', question:'3 of 6 — What are your strongest contributions: product, design, engineering, sales, research, community, or something else?'},
  {key:'neededSkills', question:'4 of 6 — Which strengths do you need beside you? Name skills or responsibilities you do not want to own alone.'},
  {key:'workingStyle', question:'5 of 6 — How do you prefer to make decisions and handle disagreement in a team?'},
  {key:'test', question:'6 of 6 — What small 7-day project could you and a potential co-founder do together before committing?'}
];
function ensureFounderGuide(){
  if(state.aiMessages.length) return;
  state.aiMessages = [guideMessage('assistant', `Hi — I’m Ria. You can vent here, think through a friendship or a hard week, find people to build with, or turn an idea into a team. What would help most today?`, [
    ['checkin','I need to talk'], ['cofounder','Co-founder interview'], ['team','Build a team'], ['plan','Choose my next step']
  ])];
}
function startCofounderInterview(){
  state.cofounderStep=0; state.cofounderAnswers={};
  state.aiMessages.push(guideMessage('assistant', `Let’s find a co-founder through the questions that matter in a real partnership: mission, commitment, complementary strengths, working style, and a small test project. There are no perfect answers — just answer honestly.\n\n${COFOUNDER_QUESTIONS[0].question}`));
  render();
}
function continueCofounderInterview(answer){
  const question=COFOUNDER_QUESTIONS[state.cofounderStep];
  state.cofounderAnswers[question.key]=answer;
  state.cofounderStep++;
  if(state.cofounderStep<COFOUNDER_QUESTIONS.length){
    state.aiMessages.push(guideMessage('assistant',COFOUNDER_QUESTIONS[state.cofounderStep].question));
  }else{
    const b=state.cofounderAnswers;
    state.aiMessages.push(guideMessage('assistant',`Your co-founder brief is ready. You are exploring “${b.problem}”, can commit “${b.commitment}”, and want a partner who brings “${b.neededSkills}”.\n\nI've posted this to the co-founder board so others looking for a partner can see it, and I'll let you know the moment someone looks like a strong match. Before making a long-term promise, invite someone to your 7-day test: “${b.test}”`, [['cofounder','Refresh my matches'],['team','Create a team post']]));
    state.cofounderStep=null;
    saveCofounderProfileAndMatch();
  }
}

/* ---------- Co-founder board: persistent "looking" status + mutual likes (Tinder-style match) ---------- */
async function saveCofounderProfileAndMatch(){
  const myId = state.authUser.id;
  const b = state.cofounderAnswers;
  const { error } = await sb.from('cofounder_profiles').upsert({
    user_id: myId, problem:b.problem||'', commitment:b.commitment||'', strengths:b.strengths||'',
    needed_skills:b.neededSkills||'', working_style:b.workingStyle||'', test_project:b.test||'',
    looking:true, updated_at:new Date().toISOString()
  });
  if(error){ console.error('Could not save co-founder profile', error); return; }
  await loadCofounderProfiles();
  render();
}
async function loadCofounderProfiles(){
  const { data } = await sb.from('cofounder_profiles').select('*');
  state.cofounderProfiles = {};
  (data||[]).forEach(row => { state.cofounderProfiles[row.user_id] = row; });
}
function keywordOverlap(a, b){
  const words = s => (s||'').toLowerCase().match(/[a-z]{4,}/g) || [];
  const wa = new Set(words(a)), wb = words(b);
  return wb.filter(w => wa.has(w)).length;
}
function cofounderCompatibility(mineRow, otherRow, otherProfile){
  if(!mineRow || !otherRow) return { score:0, reasons:[] };
  let score = 0; const reasons = [];
  const skillHit = keywordOverlap(mineRow.needed_skills, otherRow.strengths);
  if(skillHit){ score += skillHit*6; reasons.push(`@${otherProfile.username} brings what you said you need`); }
  const skillHitReverse = keywordOverlap(otherRow.needed_skills, mineRow.strengths);
  if(skillHitReverse){ score += skillHitReverse*6; reasons.push(`You bring what @${otherProfile.username} is looking for`); }
  const problemOverlap = keywordOverlap(mineRow.problem, otherRow.problem);
  if(problemOverlap){ score += problemOverlap*3; reasons.push('Working on a related problem space'); }
  const myChipSkills = (state.me.skills||[]), myChipInterests = (state.me.interests||[]);
  const otherChipSkills = (otherProfile.skills||[]), otherChipInterests = (otherProfile.interests||[]);
  score += myChipInterests.filter(x=>otherChipInterests.includes(x)).length * 2;
  score += otherChipSkills.filter(x=>!myChipSkills.includes(x)).length;
  return { score, reasons: reasons.slice(0,2) };
}
function topCofounderMatches(limit){
  const myId = state.authUser.id;
  const mine = state.cofounderProfiles[myId];
  if(!mine) return [];
  return Object.entries(state.cofounderProfiles)
    .filter(([uid,row]) => uid!==myId && row.looking && state.profiles[uid] && !state.blocks.includes(uid))
    .map(([uid,row]) => ({ profile: state.profiles[uid], ...cofounderCompatibility(mine, row, state.profiles[uid]) }))
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit||5);
}
function isMutualCofounderMatch(myId, otherId){
  const likes = state.cofounderLikes||[];
  return likes.some(l=>l.liker===myId && l.liked===otherId) && likes.some(l=>l.liker===otherId && l.liked===myId);
}
async function alreadyNotifiedMatch(myId, otherUsername){
  const { data } = await sb.from('notifications').select('id').eq('user_id', myId).eq('type','cofounder_match').ilike('body', `%@${otherUsername}%`).limit(1);
  return !!(data && data.length);
}
async function likeCofounder(otherId){
  const myId = state.authUser.id;
  const other = state.profiles[otherId];
  if(!other) return;
  const { error } = await sb.from('cofounder_likes').insert({ liker: myId, liked: otherId });
  if(error && !String(error.message||'').toLowerCase().includes('duplicate')){ toast('Could not send interest: '+error.message); return; }
  state.cofounderLikes = state.cofounderLikes||[];
  if(!state.cofounderLikes.some(l=>l.liker===myId && l.liked===otherId)) state.cofounderLikes.push({liker:myId, liked:otherId});
  const { data: theirLike } = await sb.from('cofounder_likes').select('id').eq('liker', otherId).eq('liked', myId).limit(1);
  if(theirLike && theirLike.length){
    await sb.from('notifications').insert({ user_id: otherId, type:'cofounder_match', body:`🎉 It's a match! You and @${state.me.username} are both interested in co-founding together.` });
    showMatchOverlay(otherId, 'cofounder');
  } else {
    toast(`You're interested in @${other.username}. If they're interested too, you'll both be notified — it's a match!`);
    render();
  }
}
function hasLiked(myId, otherId){
  return (state.cofounderLikes||[]).some(l=>l.liker===myId && l.liked===otherId);
}
function founderCandidates(){
  const me = state.me||{};
  const myInterests = me.interests||[], mySkills = me.skills||[];
  return Object.values(state.profiles).filter(u=>u.id!==state.authUser.id && !u.suspended && !state.blocks.includes(u.id)).map(u=>{
    const sharedInterests = (u.interests||[]).filter(x=>myInterests.includes(x));
    const complementarySkills = (u.skills||[]).filter(x=>!mySkills.includes(x));
    let score = sharedInterests.length*4 + complementarySkills.length;
    if((u.looking_for||[]).includes('Startup')) score+=5;
    if((u.interests||[]).includes('Entrepreneurship')) score+=3;
    if((u.goals||'').trim() && (me.goals||'').trim()) score+=2;
    const needText=(state.cofounderAnswers.neededSkills||'').toLowerCase();
    if(needText && (u.skills||[]).some(skill=>needText.includes(String(skill).toLowerCase()))) score+=8;
    return {u, score, sharedInterests, complementarySkills};
  }).sort((a,b)=>b.score-a.score || a.u.username.localeCompare(b.u.username)).slice(0,4);
}
function founderMatchReason(match){
  if(match.sharedInterests.length) return `Shared: ${match.sharedInterests.slice(0,2).join(', ')}`;
  if(match.complementarySkills.length) return `Could add: ${match.complementarySkills.slice(0,2).join(', ')}`;
  return 'Open to building and connecting';
}
function isCrisisText(text){
  return /\b(suicid(e|al)|kill myself|end my life|want to die|don't want to live|hurt myself|self[- ]?harm|cut myself|overdose|harm someone)\b/i.test(text||'');
}
function isGreeting(text){
  return /^\s*(hi+|hey+|hello+|yo+|sup|what'?s up|good (morning|afternoon|evening)|namaste|hola)\s*[!.?]*\s*$/i.test(text||'');
}
function localGuideReply(text){
  const t=(text||'').toLowerCase();
  if(isGreeting(text)) return guideMessage('assistant', `Hey! Good to see you 🙂 What's going on — just want to chat, or looking to build something?`, [['checkin','I want to vent'],['cofounder','Find a co-founder'],['team','Build a team']]);
  if(/create.*team|post.*team|need.*team|team.*member/.test(t)) return guideMessage('assistant', 'A good team post makes three things easy to understand: the problem you are solving, the commitment you need, and the roles that are missing. Start with a small first milestone, not a huge promise. I can take you to a guided team post now.', [['team','Create a guided team post'],['cofounder','Do the co-founder interview']]);
  if(/co.?founder|team|partner|people/.test(t)) return guideMessage('assistant', 'Let’s make this practical. A strong founding pair usually shares the problem and values, while bringing different strengths. I’ve ranked people from Recircle below using shared interests, startup intent, and complementary skills.\n\nBefore you connect, send a short note: “I’m exploring [problem]. I can contribute [strength]. Would you be open to a 20-minute call this week?”', [['cofounder','Show my matches'],['goal','Help me write my founder brief']]);
  if(/plan|stuck|procrast|next step|goal/.test(t)) return guideMessage('assistant', 'You do not need to solve the whole startup today. Choose one outcome you can finish in 25 minutes: write the user problem in one sentence, message one potential user, or invite one possible teammate. Which one feels most doable?', [['goal','Write a founder brief'],['cofounder','Find a collaborator']]);
  if(/stress|overwhelm|burn|anxious|fail|alone|tired|sad/.test(t)) return guideMessage('assistant', 'That sounds like a lot to carry. You do not have to earn rest by finishing everything first. For the next ten minutes, try one small reset: drink water, step away from the screen, or message a person you trust.\n\nFor your work, let’s reduce the pressure: what is the smallest next action that would make today feel 1% lighter?', [['plan','Choose one small step'],['crisis','Get urgent help']]);
  if(/brief|idea|problem/.test(t)) return guideMessage('assistant', 'Great — use this simple founder brief: “We are helping [specific people] who struggle with [specific problem] by [approach]. This week I will test it by [one action].” Send me a rough version and I’ll help make it clearer.', [['cofounder','Find people for this idea'],['plan','Make a one-week plan']]);
  return guideMessage('assistant', 'I’m with you. Tell me what you are trying to build, what feels difficult right now, or the kind of person you hope to meet. We can turn it into one calm, concrete next step.', [['checkin','Do a check-in'],['cofounder','Find a co-founder'],['plan','Plan my next step']]);
}
async function askFounderGuide(text){
  text=(text||'').trim(); if(!text || state.aiBusy) return;
  ensureFounderGuide();
  state.aiMessages.push(guideMessage('user',text));
  if(state.cofounderStep!==null){ continueCofounderInterview(text); render(); return; }
  if(isGreeting(text)){ state.aiMessages.push(localGuideReply(text)); render(); return; }
  const localRiskSignal=isCrisisText(text);
  if(localRiskSignal) state.crisisPanelOpen=true;
  state.aiBusy=true; render();
  let reply=null;
  try{
    const { data:{session} } = await sb.auth.getSession();
    const payload={
      messages: state.aiMessages.slice(-8).map(m=>({role:m.role,content:m.text})),
      profile: { interests:state.me.interests||[], skills:state.me.skills||[], goals:state.me.goals||'', lookingFor:state.me.looking_for||[] },
      candidates: founderCandidates().map(m=>({username:m.u.username,interests:m.u.interests||[],skills:m.u.skills||[],lookingFor:m.u.looking_for||[],goals:m.u.goals||''})),
      cofounderBrief: state.cofounderAnswers,
      teams: state.teams.filter(t=>t.status==='open').slice(0,12).map(t=>({title:t.title,type:t.type,skillsNeeded:t.skills_needed||[],description:t.description||''}))
    };
    const response=await fetch(FOUNDER_GUIDE_API_URL,{method:'POST',headers:{'Content-Type':'application/json', ...(session?{Authorization:`Bearer ${session.access_token}`}:{})},body:JSON.stringify(payload)});
    if(response.ok){ const data=await response.json(); if(data && typeof data.reply==='string'){ if(data.crisis) state.crisisPanelOpen=true; if(data.teamDraft && typeof data.teamDraft==='object') state.lastTeamDraft=data.teamDraft; reply=guideMessage('assistant',data.reply,data.crisis?[['crisis','Safety & Support']]:(data.teamDraft?[['team','Create a team post']]:[])); } }
  }catch(e){ /* The local guide remains available when the server is unavailable. */ }
  state.aiMessages.push(reply||(localRiskSignal
    ? guideMessage('assistant','I’m really glad you said something. Please open Safety & Support now and contact someone you trust who can be with you.', [['crisis','Safety & Support']])
    : localGuideReply(text)));
  state.aiBusy=false; render();
}

  return `<section class="crisis-panel" role="alert" aria-live="assertive">
    <h3>You deserve real-time support right now.</h3>
    <p>If you are in immediate danger or think you may act on thoughts of self-harm, call emergency services. In India, call <strong>112</strong>. You can also call <strong>Tele-MANAS: 14416</strong> or <strong>1800-891-4416</strong>, a free 24/7 mental-health helpline.</p>
    <ol class="crisis-steps"><li>Move to a safer place, away from anything you could use to hurt yourself.</li><li>Call or sit with someone you trust; tell them plainly that you need support now.</li><li>Do not stay alone while the urge feels immediate.</li></ol>
    <div style="display:flex;gap:8px;flex-wrap:wrap;"><a class="btn btn-coral" href="tel:112">Call 112 now</a><a class="btn btn-primary" href="tel:14416">Call Tele-MANAS</a><button class="btn btn-outline" data-close-crisis>I'm safe for now</button></div>

function renderShell(){
  const myId = state.authUser.id;
  const pendingCount = state.requests.filter(r=>r.to_user===myId && r.status==='pending').length;
  let body='';
  if(state.view==='home') body=renderHome();

/* ---------- DISCOVER ---------- */
function renderDiscover(){
  const myId = state.authUser.id;
  const f = state.discoverFilters;
  let list = Object.values(state.profiles).filter(u=>u.id!==myId && !u.suspended && !state.blocks.includes(u.id));
  if(f.dept) list = list.filter(u=>u.department===f.dept);
  if(f.year) list = list.filter(u=>u.year===f.year);
  if(f.interest) list = list.filter(u=>(u.interests||[]).includes(f.interest));
  if(f.lookingFor) list = list.filter(u=>(u.looking_for||[]).includes(f.lookingFor));
  if(f.q) list = list.filter(u=>u.username.includes(f.q.toLowerCase()) || (u.bio||'').toLowerCase().includes(f.q.toLowerCase()));
  list.sort((a,b)=>sharedInterests(myId,b.id).length - sharedInterests(myId,a.id).length);

  return `
  <div>
    <div class="card" style="margin-bottom:18px;">
      <div class="field" style="margin-bottom:12px;"><input type="text" id="searchQ" placeholder="Search by name or bio…" value="${esc(f.q)}"></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">

function renderStudentCard(u){
  const myId = state.authUser.id;
  const shared = sharedInterests(myId,u.id);
  const connected = isConnected(myId,u.id);
  const pending = pendingRequestBetween(myId,u.id);
  let btn;
  if(connected) btn = `<button class="btn btn-outline btn-sm btn-block" data-nav-chat="${u.id}">💬 View & Chat</button>`;
  else if(pending && pending.from_user===myId) btn = `<button class="btn btn-outline btn-sm btn-block" disabled>✓ Request Sent</button>`;
  else if(pending && pending.to_user===myId) btn = `<button class="btn btn-mint btn-sm btn-block" data-respond="${pending.id}|1">Accept Request</button>`;
  else btn = `<button class="btn btn-coral btn-sm btn-block" data-connect="${u.id}">+ Connect</button>`;
  return `
  <div class="student-card">
    <div class="student-top" style="cursor:pointer;" data-view-profile="${u.id}">
      ${avatarHtml(u.username,44)}
      <div><div class="student-name">${esc(u.full_name||'@'+u.username)}</div><div class="student-meta">@${esc(u.username)} • ${esc(u.department)} • ${esc(u.year)}</div></div>
    </div>
    ${u.bio?`<div class="student-bio">${esc(u.bio.slice(0,110))}${u.bio.length>110?'…':''}</div>`:''}
    <div class="tag-row">${(u.interests||[]).slice(0,4).map(i=>`<span class="pill">${esc(i)}</span>`).join('')}</div>
    ${shared.length>0?`<div class="shared-note">✨ ${shared.length} shared interest${shared.length===1?'':'s'}: ${shared.slice(0,3).map(esc).join(', ')}</div>`:''}

async function renderChatThread(otherId){
  const myId = state.authUser.id;
  const box = document.getElementById('chatMsgs'); if(!box) return;
  const msgs = await loadMessages(otherId);
  box.innerHTML = msgs.length? msgs.map(m=>{
    const photo = m.image_url ? `<img src="${esc(m.image_url)}" class="chat-photo" data-lightbox="${esc(m.image_url)}" alt="Shared photo">` : '';
    const text = m.body ? `<div class="${m.image_url?'':'msg-bubble'}" style="${m.image_url?'margin-top:6px;':''}">${esc(m.body)}</div>` : '';
    return `<div class="msg-row ${m.sender===myId?'mine':''}">${photo}${text}</div>`;
  }).join('') : `<div style="text-align:center;color:var(--ink-faint);font-size:13px;margin-top:20px;">Say hello 👋 — this is the start of your conversation.</div>`;
  box.scrollTop = box.scrollHeight;
  document.querySelectorAll('[data-lightbox]').forEach(el=>el.addEventListener('click', ()=>openLightbox(el.getAttribute('data-lightbox'))));
}
function openLightbox(url){
  const bg = document.createElement('div');
  bg.className='modal-bg'; bg.style.background='rgba(0,0,0,.88)';
  bg.innerHTML = `<img src="${esc(url)}" style="max-width:100%;max-height:88vh;border-radius:12px;">`;
  bg.addEventListener('click', ()=>bg.remove());
  document.body.appendChild(bg);
}

/* ---------- NOTIFICATIONS ---------- */
function renderNotifications(){
  const myId = state.authUser.id;
  const incoming = state.requests.filter(r=>r.to_user===myId && r.status==='pending');
  return `<div>
    ${incoming.length>0?`<div class="section-head"><h2>Connection requests</h2></div>
    <div class="grid">${incoming.map(r=>{
      const u = state.profiles[r.from_user]||{username:'?'};
      const shared = sharedInterests(myId,r.from_user);
      return `<div class="student-card">
        <div class="student-top">${avatarHtml(u.username,44)}<div><div class="student-name">@${esc(u.username)}</div><div class="student-meta">${esc(u.department||'')} • ${esc(u.year||'')}</div></div></div>
        ${shared.length>0?`<div class="shared-note">✨ ${shared.length} shared interest${shared.length===1?'':'s'}</div>`:''}
        <div style="display:flex;gap:8px;"><button class="btn btn-mint btn-sm btn-block" data-respond="${r.id}|1">Accept</button><button class="btn btn-outline btn-sm btn-block" data-respond="${r.id}|0">Not now</button></div>
      </div>`;
    }).join('')}</div>`:''}
    <div class="section-head"><h2>Recent activity</h2></div>
    ${state.notifs.length===0?`<div class="empty-state"><div class="e-icon">🔔</div><h3>Nothing new</h3><p>Your notifications will show up here.</p></div>` :
    `<div class="card">${state.notifs.map(n=>`<div class="switch-row"><div>${esc(n.body)}</div><div class="student-meta">${timeAgo(n.created_at)}</div></div>`).join('')}</div>`}
  </div>`;
}

/* ---------- PROFILE ---------- */
function renderProfile(userId, isMine){
  const u = state.profiles[userId]; if(!u) return '<div class="empty-state">Profile not found.</div>';
  const myId = state.authUser.id;
  const shared = isMine? [] : sharedInterests(myId,userId);
  const connected = !isMine && isConnected(myId,userId);
  const blocked = state.blocks.includes(userId);
  if(isMine && state.editingProfile) return renderEditProfile(u);
  return `<div>
    <div class="card card-shadow" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 20px;">
      ${avatarHtml(u.username,74)}
      <div style="font-family:'Sora';font-weight:800;font-size:20px;margin-top:12px;">${esc(u.full_name||'@'+u.username)}</div>
      <div class="student-meta" style="margin-top:2px;">@${esc(u.username)} • ${esc(u.department)} • ${esc(u.year)}</div>
      ${u.bio?`<p style="max-width:420px;color:var(--ink-soft);font-size:14px;margin-top:12px;">${esc(u.bio)}</p>`:''}
      ${shared.length>0?`<div class="shared-note" style="margin-top:8px;">✨ You both share: ${shared.map(esc).join(', ')}</div>`:''}
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center;">
        ${isMine ? `<button class="btn btn-primary" id="editProfileBtn">Edit Profile</button>` :
        connected ? `<button class="btn btn-primary" data-nav-chat="${userId}">💬 Message</button>` :
        pendingRequestBetween(myId,userId) ? `<button class="btn btn-outline" disabled>Request pending</button>` :
        `<button class="btn btn-coral" data-connect="${userId}">+ Connect</button>`}
        ${!isMine?`<button class="btn btn-ghost btn-sm" data-safety="${userId}">⋯ More</button>`:''}
      </div>
      ${!isMine && blocked ? `<div class="pill pill-coral" style="margin-top:10px;">You've blocked this user</div>`:''}
    </div>
    <div class="section-head"><h2>Interests</h2></div>
    <div class="tag-row">${(u.interests||[]).length?(u.interests||[]).map(i=>`<span class="pill">${esc(i)}</span>`).join(''):'<span class="student-meta">Not shared yet.</span>'}</div>
    <div class="section-head"><h2>Skills</h2></div>
    <div class="tag-row">${(u.skills||[]).length?(u.skills||[]).map(i=>`<span class="pill pill-violet">${esc(i)}</span>`).join(''):'<span class="student-meta">Not shared yet.</span>'}</div>
    <div class="section-head"><h2>Looking for</h2></div>
    <div class="tag-row">${(u.looking_for||[]).length?(u.looking_for||[]).map(i=>`<span class="pill pill-sun">${esc(i)}</span>`).join(''):'<span class="student-meta">Not shared yet.</span>'}</div>
    ${u.goals?`<div class="section-head"><h2>Goals</h2></div><div class="card">${esc(u.goals)}</div>`:''}
    ${isMine?`
    <div class="section-head"><h2>Settings</h2></div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-outline btn-block" data-nav="privacy">🔒 Privacy Center</button>
      <button class="btn btn-outline btn-block" data-action="logout">🚪 Log out</button>
    </div>`:''}
  </div>`;
}
function renderEditProfile(u){
  return `<div class="card card-shadow">
    <h2 style="margin-top:0;">Edit Profile</h2>
    <div class="field"><label>Real name</label><input id="editFullName" maxlength="60" value="${esc(u.full_name||'')}" placeholder="Your name"></div>
    <div class="field"><label>Username</label><input id="editUsername" maxlength="20" value="${esc(u.username||'')}" placeholder="e.g. arun_cse"><div class="student-meta" style="margin-top:5px;">Letters, numbers, and underscores only. Changing this never changes your connections.</div></div>
    <div class="field"><label>Bio</label><textarea id="editBio" rows="3">${esc(u.bio||'')}</textarea></div>
    <div class="field"><label>Department</label><select id="editDept">${DEPARTMENTS.map(d=>`<option ${u.department===d?'selected':''}>${d}</option>`).join('')}</select></div>
    <div class="field"><label>Year</label><select id="editYear">${YEARS.map(y=>`<option ${u.year===y?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="field"><label>Interests</label><div class="chip-select" id="editInterests">${INTEREST_OPTIONS.map(i=>`<button type="button" class="chip ${((u.interests||[]).includes(i))?'selected':''}" data-chip="${i}">${i}</button>`).join('')}</div></div>
    <div class="field"><label>Skills</label><div class="chip-select" id="editSkills">${SKILL_OPTIONS.map(i=>`<button type="button" class="chip ${((u.skills||[]).includes(i))?'selected':''}" data-chip="${i}">${i}</button>`).join('')}</div></div>
    <div class="field"><label>Looking for</label><div class="chip-select" id="editLooking">${LOOKING_FOR_OPTIONS.map(i=>`<button type="button" class="chip ${((u.looking_for||[]).includes(i))?'selected':''}" data-chip="${i}">${i}</button>`).join('')}</div></div>
    <div class="field"><label>Goals</label><textarea id="editGoals" rows="2">${esc(u.goals||'')}</textarea></div>
    <div style="display:flex;gap:10px;"><button class="btn btn-outline btn-block" id="cancelEdit">Cancel</button><button class="btn btn-primary btn-block" id="saveEdit">Save changes</button></div>
  </div>`;
}

/* ---------- PRIVACY ---------- */
function renderPrivacy(){
  return `<div>
    <h2 style="margin-top:0;">Private by default. Transparent moderation when necessary.</h2>
    <div class="card" style="margin-bottom:14px;"><h3>What information do we collect?</h3><p style="color:var(--ink-soft);font-size:14px;">Your email and password (managed securely by Supabase Auth, never visible to us in plain text), department, year, and anything you add to your profile.</p></div>
    <div class="card" style="margin-bottom:14px;"><h3>Who can see it?</h3><p style="color:var(--ink-soft);font-size:14px;">Other registered students can see your profile in Discover. Messages are only visible to you and the person you're chatting with — enforced at the database level.</p></div>
    <div class="card" style="margin-bottom:14px;"><h3>What can administrators access?</h3><p style="color:var(--ink-soft);font-size:14px;">Admins see aggregate stats and can review reported activity. Every admin action is written to an audit log.</p></div>
    <div class="card" style="margin-bottom:14px;"><h3>How does Founder Guide use data?</h3><p style="color:var(--ink-soft);font-size:14px;">Founder Guide chats are not stored in Recircle. When its AI service is enabled, the recent conversation plus the profile summary needed to suggest collaborators are sent to that service. A serious safety-risk signal may create a private review case containing a short excerpt for designated admins. It is not a therapist, diagnosis tool, or emergency service.</p></div>
    <div class="card" style="margin-bottom:14px;"><h3>How can I block someone?</h3><p style="color:var(--ink-soft);font-size:14px;">Open their profile or a chat and choose "⋯ More → Block." Blocked users won't appear in your Discover feed.</p></div>
    <div class="card"><h3>Data retention</h3><p style="color:var(--ink-soft);font-size:14px;">Your data is kept as long as your account is active.</p></div>
  </div>`;
}

/* =========================================================
   EVENT BINDING — shell
   ========================================================= */
async function goToView(v){
  state.editingProfile=false; state.view=v; render();
  if(v==='founderGuide' || v==='cofounderDashboard'){
    await loadCofounderProfiles();
    render();
  }
}
function closeMoreSheet(){
  const bg = document.getElementById('moreSheetBg');
  if(bg) bg.remove();
}
function bindShellEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>goToView(el.getAttribute('data-nav'))));
  const moreNavBtn = document.getElementById('moreNavBtn');
  if(moreNavBtn) moreNavBtn.addEventListener('click', ()=>{
    const wrap = document.createElement('div');
    wrap.innerHTML = renderMoreSheet();
    document.body.appendChild(wrap.firstElementChild);
    document.querySelectorAll('[data-more-nav]').forEach(el=>el.addEventListener('click', ()=>{ closeMoreSheet(); goToView(el.getAttribute('data-more-nav')); }));
    const bg = document.getElementById('moreSheetBg');
    if(bg) bg.addEventListener('click', e=>{ if(e.target.id==='moreSheetBg') closeMoreSheet(); });
  });
  document.querySelectorAll('[data-open-crisis]').forEach(el=>el.addEventListener('click', ()=>{ state.crisisPanelOpen=true; render(); }));
  document.querySelectorAll('[data-close-crisis]').forEach(el=>el.addEventListener('click', ()=>{ state.crisisPanelOpen=false; render(); }));
  async function stopLooking(){
    await sb.from('cofounder_profiles').update({ looking:false }).eq('user_id', state.authUser.id);
    await loadCofounderProfiles();
    toast('You\'re off the co-founder board. You can restart the interview any time.');
    render();
  }
  const stopLookingBtn = document.getElementById('stopLookingBtn');
  if(stopLookingBtn) stopLookingBtn.addEventListener('click', stopLooking);
  const stopLookingBtnDash = document.getElementById('stopLookingBtnDash');
  if(stopLookingBtnDash) stopLookingBtnDash.addEventListener('click', stopLooking);
  document.querySelectorAll('[data-ai-action]').forEach(el=>el.addEventListener('click', ()=>{
    const action=el.getAttribute('data-ai-action');
    const prompts={
      checkin:'I want to check in. I feel:',
      plan:'Help me choose one small next step today.',
      goal:'Help me write a clear founder brief.',
    };
    if(action==='crisis'){ state.crisisPanelOpen=true; render(); return; }
    if(action==='cofounder'){ startCofounderInterview(); return; }
    if(action==='team'){
      const draft = buildTeamDraftFromGuide();
      state.teamFormOpen=true; state.view='teams';
      state.onboardData={skillsNeeded:(draft&&draft.skillsNeeded)||[]};
      state.pendingTeamDraft = draft;
      state.teamFormDraft = null;
      render();
      toast(draft ? 'I\'ve drafted a starting point below — edit anything before posting.' : 'Describe the problem clearly and choose the skills you need.');
      return;
    }
    askFounderGuide(prompts[action]||'I need help with my startup journey.');
  }));
  document.querySelectorAll('[data-ai-connect]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.getAttribute('data-ai-connect');
    if(isConnected(state.authUser.id,id)){ state.viewingProfile=id; state.view='viewProfile'; render(); }
    else sendConnectRequest(id);
  }));
  document.querySelectorAll('[data-cofounder-like]').forEach(el=>el.addEventListener('click', ()=>likeCofounder(el.getAttribute('data-cofounder-like'))));
  const guideInput=document.getElementById('guideInput');
  const guideSend=document.getElementById('guideSend');
  if(guideInput && guideSend){
    const sendGuide=()=>{ const text=guideInput.value; guideInput.value=''; askFounderGuide(text); };
    guideSend.addEventListener('click',sendGuide);
    guideInput.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendGuide(); } });
    const guideChat=document.getElementById('guideChat'); if(guideChat) guideChat.scrollTop=guideChat.scrollHeight;
  }
  document.querySelectorAll('[data-action="logout"]').forEach(el=>el.addEventListener('click', doLogout));
  document.querySelectorAll('[data-connect]').forEach(el=>el.addEventListener('click', ()=>sendConnectRequest(el.getAttribute('data-connect'))));
  document.querySelectorAll('[data-respond]').forEach(el=>el.addEventListener('click', ()=>{ const [id,acc]=el.getAttribute('data-respond').split('|'); respondRequest(id, acc==='1'); }));
  document.querySelectorAll('[data-view-profile]').forEach(el=>el.addEventListener('click', ()=>{ state.viewingProfile=el.getAttribute('data-view-profile'); state.view='viewProfile'; render(); }));
  document.querySelectorAll('[data-nav-chat]').forEach(el=>el.addEventListener('click', ()=>{
    state.activeChatWith = el.getAttribute('data-nav-chat'); state.view='chatThread'; render();
    setTimeout(()=>renderChatThread(state.activeChatWith), 30);
  }));

  const searchQ = document.getElementById('searchQ');
  if(searchQ) searchQ.addEventListener('input', e=>{ state.discoverFilters.q=e.target.value; render(); const el=document.getElementById('searchQ'); if(el){el.focus(); el.setSelectionRange(el.value.length,el.value.length);} });
  ['filterDept','filterYear','filterInterest','filterLooking'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    const key = { filterDept:'dept', filterYear:'year', filterInterest:'interest', filterLooking:'lookingFor' }[id];
    el.addEventListener('change', e=>{ state.discoverFilters[key]=e.target.value; render(); });
  });

  const openForm = document.getElementById('openTeamForm');
  if(openForm) openForm.addEventListener('click', ()=>{ state.teamFormOpen=true; state.onboardData={skillsNeeded:[]}; state.pendingTeamDraft=null; state.teamFormDraft=null; render(); });
  const cancelForm = document.getElementById('cancelTeamForm');
  if(cancelForm) cancelForm.addEventListener('click', ()=>{ state.teamFormOpen=false; state.pendingTeamDraft=null; state.teamFormDraft=null; render(); });
  document.querySelectorAll('[data-skill]').forEach(el=>el.addEventListener('click', ()=>{ state.onboardData.skillsNeeded=state.onboardData.skillsNeeded||[]; toggleChip(state.onboardData.skillsNeeded, el.getAttribute('data-skill')); el.classList.toggle('selected'); }));
  const teamTitleEl = document.getElementById('teamTitle');
  const teamDescEl = document.getElementById('teamDesc');
  const teamTypeEl = document.getElementById('teamType');
  const teamSizeEl = document.getElementById('teamSize');
  if(teamTitleEl) teamTitleEl.addEventListener('input', e=>{ state.teamFormDraft.title = e.target.value; });
  if(teamDescEl) teamDescEl.addEventListener('input', e=>{ state.teamFormDraft.description = e.target.value; });
  if(teamTypeEl) teamTypeEl.addEventListener('change', e=>{ state.teamFormDraft.type = e.target.value; });
  if(teamSizeEl) teamSizeEl.addEventListener('input', e=>{ state.teamFormDraft.size = parseInt(e.target.value)||4; });
  const submitForm = document.getElementById('submitTeamForm');
  if(submitForm) submitForm.addEventListener('click', ()=>{
    const title = document.getElementById('teamTitle').value.trim();
    const desc = document.getElementById('teamDesc').value.trim();
    const type = document.getElementById('teamType').value;
    const size = parseInt(document.getElementById('teamSize').value)||4;
    if(!title||!desc){ toast('Please fill in a title and description.'); return; }
    createTeam({ title, description:desc, type, size, skillsNeeded: state.onboardData.skillsNeeded||[] });
  });
  document.querySelectorAll('[data-apply-team]').forEach(el=>el.addEventListener('click', ()=>applyToTeam(el.getAttribute('data-apply-team'))));
  document.querySelectorAll('[data-view-team]').forEach(el=>el.addEventListener('click', async ()=>{ state.viewingTeam=el.getAttribute('data-view-team'); await loadApplicants(state.viewingTeam); render(); }));
  const closeTeamModal = document.getElementById('closeTeamModal');
  if(closeTeamModal) closeTeamModal.addEventListener('click', ()=>{ state.viewingTeam=null; render(); });
  const teamModalBg = document.getElementById('teamModalBg');
  if(teamModalBg) teamModalBg.addEventListener('click', e=>{ if(e.target.id==='teamModalBg'){ state.viewingTeam=null; render(); }});
  document.querySelectorAll('[data-decide]').forEach(el=>el.addEventListener('click', ()=>{ const [teamId,uid,acc]=el.getAttribute('data-decide').split('|'); decideApplicant(teamId, uid, acc==='1'); }));

  const chatBackBtn = document.getElementById('chatBackBtn');
  if(chatBackBtn) chatBackBtn.addEventListener('click', ()=>{ state.view='chatList'; render(); });
  const sendBtn = document.getElementById('sendMsgBtn');
  const chatInput = document.getElementById('chatInput');
  const photoBtn = document.getElementById('photoBtn');
  const photoInput = document.getElementById('photoInput');
  if(sendBtn && chatInput){
    const send = ()=>{ const v=chatInput.value; chatInput.value=''; sendMessage(state.activeChatWith, v); };
    sendBtn.addEventListener('click', send);
    chatInput.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
    setTimeout(()=>renderChatThread(state.activeChatWith), 30);
  }
  if(photoBtn && photoInput){
    const photoBtnDefault = photoBtn.innerHTML;
    photoBtn.addEventListener('click', ()=>{ photoInput.value=''; photoInput.click(); });
    photoInput.addEventListener('change', async ()=>{
      const file = photoInput.files && photoInput.files[0];
      if(!file) return;
      photoBtn.disabled = true; photoBtn.style.opacity = '0.45';
      try{
        const url = await uploadChatPhoto(file);
        if(url){
          const caption = chatInput ? chatInput.value : '';
          if(chatInput) chatInput.value = '';
          await sendMessage(state.activeChatWith, caption, url);
        }
      } catch(e){
        toast('Could not send that photo: '+e.message);
      } finally {
        photoBtn.disabled = false; photoBtn.style.opacity = '';
        photoBtn.innerHTML = photoBtnDefault;
      }
    });
  }
  document.querySelectorAll('[data-starter]').forEach(el=>el.addEventListener('click', ()=>sendMessage(state.activeChatWith, el.getAttribute('data-starter'))));

  const editBtn = document.getElementById('editProfileBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{ state.editingProfile=true; render(); });
  const cancelEdit = document.getElementById('cancelEdit');
  if(cancelEdit) cancelEdit.addEventListener('click', ()=>{ state.editingProfile=false; render(); });
  document.querySelectorAll('[data-chip]').forEach(el=>el.addEventListener('click', ()=>{
    const parentId = el.parentElement.id;
    const key = { editInterests:'interests', editSkills:'skills', editLooking:'looking_for' }[parentId];
    state.me[key] = state.me[key]||[];
    toggleChip(state.me[key], el.getAttribute('data-chip'));
    el.classList.toggle('selected');
  }));
  const saveEdit = document.getElementById('saveEdit');
  if(saveEdit) saveEdit.addEventListener('click', async ()=>{
    const fullName = document.getElementById('editFullName').value.trim().replace(/\s+/g,' ');
    const username = document.getElementById('editUsername').value.trim().toLowerCase();
    if(fullName.length<2 || fullName.length>60){ toast('Enter a real name between 2 and 60 characters.'); return; }
    if(!/^[a-z0-9_]{3,20}$/.test(username)){ toast('Username must be 3-20 letters, numbers, or underscores.'); return; }
    if(username!==state.me.username){
      const { data: existing, error: lookupError } = await sb.from('profiles').select('id').eq('username',username).neq('id',state.authUser.id).maybeSingle();
      if(lookupError){ toast('Could not check that username. Please try again.'); return; }
      if(existing){ toast('That username is already taken.'); return; }
    }
    const updates = {
      full_name: fullName,
      username,
      bio: document.getElementById('editBio').value.trim(),
      department: document.getElementById('editDept').value,
      year: document.getElementById('editYear').value,
      goals: document.getElementById('editGoals').value.trim(),
      interests: state.me.interests||[], skills: state.me.skills||[], looking_for: state.me.looking_for||[]
    };
    const { error } = await sb.from('profiles').update(updates).eq('id', state.authUser.id);
    if(error){ toast('Could not save: '+error.message); return; }
    await loadAllData();
    state.editingProfile=false; toast('Profile updated!'); render();
  });

  document.querySelectorAll('[data-safety]').forEach(el=>el.addEventListener('click', ()=>openSafetyModal(el.getAttribute('data-safety'))));
}
function openSafetyModal(targetId){
  const blocked = state.blocks.includes(targetId);
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = `<div class="modal-box">
    <h3 style="margin-top:0;">@${esc(pName(targetId))}</h3>
    <button class="btn btn-outline btn-block" style="margin-bottom:10px;" id="blockBtn">${blocked?'Unblock':'Block'} this student</button>
    <div class="field"><label>Report this student</label><select id="reportReason"><option>Harassment</option><option>Spam</option><option>Fake account</option><option>Impersonation</option><option>Inappropriate content</option><option>Other</option></select></div>
    <div class="field"><textarea id="reportDetails" rows="2" placeholder="Add any details (optional)"></textarea></div>
    <div style="display:flex;gap:10px;"><button class="btn btn-outline btn-block" id="closeSafety">Cancel</button><button class="btn btn-coral btn-block" id="submitReportBtn">Submit report</button></div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#closeSafety').addEventListener('click', ()=>bg.remove());
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#blockBtn').addEventListener('click', async ()=>{ await toggleBlock(targetId); bg.remove(); toast(blocked?'Unblocked.':'Blocked.'); });
  bg.querySelector('#submitReportBtn').addEventListener('click', async ()=>{
    const reason = bg.querySelector('#reportReason').value; const details = bg.querySelector('#reportDetails').value;
    await submitReport(targetId, reason, details); bg.remove();
  });
}
